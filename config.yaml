# ==============================================================================
# Toolbench Master Configuration
# ==============================================================================

# MCP Server Definitions
# Windows requirement: npx servers are wrapped with 'cmd /c'. uvx and docker run natively.
# NOTE (Tool Count Ceiling Warning): These 5 servers typically yield ~27-37 tools.
# If total tools < 40, F1.5 and the Pilot Gate will evaluate adding a 6th server (e.g. Docker GitHub MCP).
mcp:
  - name: "filesystem"
    command: "cmd"
    args:
      - "/c"
      - "npx"
      - "-y"
      - "@modelcontextprotocol/server-filesystem"
      - "D:\\tool-bench\\data"

  - name: "memory"
    command: "cmd"
    args:
      - "/c"
      - "npx"
      - "-y"
      - "@modelcontextprotocol/server-memory"

  - name: "git"
    command: "uvx"
    args:
      - "mcp-server-git"
      - "-r"
      - "D:\\tool-bench"

  - name: "fetch"
    command: "uvx"
    args:
      - "mcp-server-fetch"

  - name: "time"
    command: "uvx"
    args:
      - "mcp-server-time"

# LLM Provider Configuration
# VERIFIED: Active model selected from Google AI Studio dashboard on 2026-11-15
model:
  provider: "gemini"
  name: "gemini-3.5-flash-lite"
  api_key_env: "GEMINI_API_KEY"

# Synthetic Prompt Generation Settings (F2)
generation:
  count: 160
  temperature: 0.7
  prompts_per_tool: 3
  max_words: 200

# Benchmark Evaluation Settings (F4+F7)
# Note: temperature is strictly enforced to 0.0 for measurement reproducibility.
# max_retries is strictly for LLM schema argument validation (capped at 1).
evaluation:
  temperature: 0.0
  max_retries: 1

# Embedding Retrieval Settings (F5, D1)
retrieval:
  model_name: "all-MiniLM-L6-v2"
  candidate_k_values: [5, 10, 15, 20, 25, 30]
  target_recall: 0.95

# Dataset Split and Freeze Invariants (F3)
split:
  heldout_size: 50
  min_dev_size: 40
  seed: 42
  similarity_threshold: 0.8
  max_cluster_size: 5

# Rate Limiting & Backoff (F11b)
# VERIFIED: Quotas confirmed from user's AI Studio dashboard on 2026-11-15:
# 15 RPM, 500 RPD, 250K TPM.
rate_limit:
  rpm: 15
  rpd: 500
  tpm: 250000
  backoff_factor: 2.0
  max_backoff: 60.0
  max_retries: 5  # HTTP 429 exponential backoff retries (distinct from schema retry)
