[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "toolbench"
version = "0.1.0"
description = "CLI for measuring and improving MCP tool selection by LLMs"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9",
    "rich>=13.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "torch>=2.0",                          # NEW: explicit so we can pin to CPU index
    "sentence-transformers>=2.2",
    "numpy>=1.24",
    "mcp>=1.0",
    "google-genai>=1.0",
    "jsonschema>=4.17",
    "rank-bm25>=0.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "pytest>=8.0",
]

[project.scripts]
toolbench = "toolbench.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/toolbench"]

# NEW: Tell uv where to find the CPU-only PyTorch wheels
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# NEW: Force torch to come from the CPU index, not PyPI
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]